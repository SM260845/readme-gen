name: Action self-test

on:
  workflow_dispatch:
    inputs:
      style:
        description: Style to generate
        type: choice
        options: [professional, trendy, minimalist, comprehensive]
        default: trendy
  pull_request:
    paths:
      - action.yml
      - .github/workflows/action-selftest.yml

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the action (fixture provider, no API key)
        id: gen
        uses: ./
        with:
          style: ${{ inputs.style || 'trendy' }}
          provider: fixture
          output: out/README.generated.md
          artifact-name: repo2readme-selftest
      - name: Check the output
        env:
          OUT: ${{ steps.gen.outputs.path }}
        run: |
          test -s "$OUT"
          grep -q '^# repo2readme' "$OUT"
          grep -q 'Generated by repo2readme' "$OUT"
          echo "Generated $(wc -l < "$OUT") lines at $OUT"
